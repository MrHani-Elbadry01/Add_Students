<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأستاذ هاني البدري</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="container">

    <div class="card">

        <img src="./623362388_3086848998188403_6261243284070930839_n.jpg"
             class="logo"
             alt="Logo">

        <h1>أستاذ هاني البدري</h1>

        <p class="desc">
            نظام تسجيل الطلاب والحضور الإلكتروني
        </p>

        <form id="studentForm">

            <!-- الاسم -->
            <label for="name">الاسم بالكامل</label>

            <input
                type="text"
                id="name"
                placeholder="اكتب اسمك بالكامل"
                required
            >

            <!-- الصف -->
            <label for="grade">الصف</label>

            <select id="grade" required>

                <option value="">اختر الصف</option>

                <option value="أولى إعدادي">أولى إعدادي</option>
                <option value="ثانية إعدادي">ثانية إعدادي</option>
                <option value="ثالثة إعدادي">ثالثة إعدادي</option>

                <option value="أولى ثانوي">أولى ثانوي</option>
                <option value="ثانية ثانوي">ثانية ثانوي</option>
                <option value="ثالثة ثانوي">ثالثة ثانوي</option>

            </select>

            <!-- رقم ولي الأمر -->
            <label for="parentPhone">رقم ولي الأمر</label>

            <input
                type="tel"
                id="parentPhone"
                placeholder="01xxxxxxxxx"
                maxlength="11"
                required
            >

            <!-- أيام الحصة -->
            <label for="days">أيام الحصة</label>

            <select id="days" required>

                <option value="">اختر أيام الحصة</option>

                <option value="السبت والثلاثاء">
                    السبت والثلاثاء
                </option>

                <option value="الأحد والأربعاء">
                    الأحد والأربعاء
                </option>

                <option value="الإثنين والخميس">
                    الإثنين والخميس
                </option>

            </select>

            <button id="registerBtn" type="submit">
                تسجيل
            </button>

        </form>

        <!-- رسالة النجاح -->

        <div id="success">

            <h2>✅ تم تسجيلك بنجاح</h2>

            <h3>كود الطالب</h3>

            <div id="studentCode"></div>

            <div id="qrcode"></div>

            <button id="downloadQR" type="button">
                تحميل QR
            </button>

            <p>
                احتفظ بهذا الـ QR لاستخدامه في تسجيل الحضور.
            </p>

        </div>

    </div>

</div>

<!-- شاشة التحميل -->

<div id="loadingOverlay" class="loading-overlay">

    <div class="loader-box">

        <div class="spinner"></div>

        <h3>جاري تسجيل البيانات...</h3>

        <p>يرجى الانتظار وعدم إغلاق الصفحة...</p>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="script.js"></script>

</body>
</html>
